<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Commercial Tool</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   CHARTE — Radio Monaco
   Orange       : CO M45 Y100 K0  · R245 G156 B0  · #F59C00
   Orange foncé : CO M45 Y100 K20 · R205 G134 B0  · #D08600
   Déclinaisons de l'orange : 100 / 75 / 50 / 25 %
   ========================================================== */
:root{
  color-scheme:light;   /* l'application est conçue en clair : on neutralise le mode sombre automatique de Bulma */
  --orange:#F59C00; --orange-75:#F8B540; --orange-50:#FACE80; --orange-25:#FDE6BF; --orange-dark:#D08600;
  --ink:#33291A; --ink-soft:rgba(51,41,26,.55);
  --hdr-bg:#FFFBF4; --page-bg:#F7F4EE; --card:#FFFFFF; --border:rgba(51,41,26,.12);
  --danger:#C62828; --ok:#2E7D32; --hdr-h:116px;
}
html,body{background:var(--page-bg);}
body{color:var(--ink);min-height:100vh;font-family:'Inter',sans-serif;font-size:14px;}

/* ───────────────────────── HEADER ───────────────────────── */
.hdr{background:var(--hdr-bg);height:var(--hdr-h);display:grid;grid-template-columns:320px 1fr auto auto;align-items:stretch;
  position:sticky;top:0;z-index:100;overflow:hidden;border-bottom:3px solid var(--orange);box-shadow:0 2px 8px rgba(51,41,26,.06);}
.hdr-brand{display:flex;align-items:center;justify-content:center;padding:0 14px;border-right:1px solid var(--border);overflow:hidden;}
.hdr-brand img{height:88px;width:auto;max-width:100%;flex-shrink:0;display:block;object-fit:contain;}
.hdr-nav{display:flex;align-items:stretch;justify-content:center;flex:1;}
.nav-btn{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:0 22px;border:none;background:transparent;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;
  transition:color .18s,background .18s;border-bottom:3px solid transparent;white-space:nowrap;}
.nav-btn::after{content:'';position:absolute;right:0;top:20%;bottom:20%;width:1px;background:var(--border);}
.hdr-nav .nav-btn:last-child::after{display:none;}
.nav-btn:hover{color:var(--ink);background:var(--orange-25);}
.nav-btn.active{color:var(--orange-dark);background:var(--orange-25);border-bottom-color:var(--orange);}
.nav-btn-ico{font-size:24px;line-height:1;}
.nav-btn-txt{white-space:normal;text-align:center;line-height:1.2;}
.nav-btn.hidden{display:none;}
.nav-btn-stripe{position:relative;overflow:hidden;border-left:1px solid var(--border);}
.nav-btn-stripe::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(45deg,rgba(245,156,0,.14) 0px,rgba(245,156,0,.14) 10px,transparent 10px,transparent 20px);}
.nav-btn-stripe .nav-btn-ico,.nav-btn-stripe .nav-btn-txt{position:relative;z-index:1;}
.badge{position:absolute;top:22px;right:14px;z-index:2;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.badge:empty{display:none;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:0 24px;border-left:1px solid var(--border);}
.hdr-clock{font-family:'Share Tech Mono',monospace;font-size:38px;font-weight:700;color:var(--ink);letter-spacing:.02em;white-space:nowrap;line-height:1;}
.hdr-user{display:flex;align-items:center;gap:8px;}
.hdr-user select{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink);border:1px solid var(--border);border-radius:6px;background:#fff;padding:3px 6px;max-width:150px;}
.hdr-user .gear{border:1px solid var(--border);background:#fff;border-radius:6px;width:26px;height:24px;cursor:pointer;font-size:13px;line-height:1;}
.hdr-user .gear:hover{background:var(--orange-25);}
.hdr-role{font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-soft);}

/* ───────────────────────── COMPOSANTS ───────────────────────── */
.modal{z-index:300;}
.modal-card{width:min(720px,94vw);}
.modal-card.wide{width:min(1100px,96vw);}
.modal-card-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:22px;}
.modal-card-head{border-bottom:3px solid var(--orange);}
.modal-card-foot{gap:10px;}
.dropzone{display:flex;align-items:center;justify-content:center;gap:14px;text-align:left;border:2px dashed var(--orange-50);background:var(--orange-25);border-radius:10px;padding:26px 20px;cursor:pointer;color:var(--orange-dark);}
.dropzone:hover,.dropzone.over{background:var(--orange-50);border-color:var(--orange);}
.dropzone.has{border-style:solid;background:#fff;color:var(--ink);}
.dropzone small{color:var(--ink-soft);}
.modal-card-foot .button{margin:0 !important;}
.button.is-primary{background:var(--orange);color:#fff;border-color:transparent;font-weight:700;}
.button.is-primary:hover,.button.is-primary:focus{background:var(--orange-dark);color:#fff;}
.button.is-light-orange{background:var(--orange-25);color:var(--orange-dark);border-color:var(--orange-50);font-weight:700;}
.button.is-light-orange:hover{background:var(--orange-50);}
.tag.o25{background:var(--orange-25);color:var(--orange-dark);font-weight:700;}
.tag.ok{background:#E3F1E4;color:var(--ok);font-weight:700;}
.tag.ko{background:#FBE3E1;color:var(--danger);font-weight:700;}
.tag.grey{background:#EEEAE2;color:var(--ink-soft);font-weight:700;}

.page{display:none;padding:28px 40px 60px;}
.page.active{display:block;}
.dash-sub{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--orange-dark);margin:0 0 8px;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);text-align:center;margin:10px 0 8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-cell{position:relative;min-height:96px;border-radius:8px;border:1px solid var(--border);padding:8px 10px;display:flex;flex-direction:column;background:#fff;}
.cal-cell.cal-empty{border-color:transparent;background:transparent;}
.cal-cell.clickable{cursor:pointer;}
.cal-cell.clickable:hover{box-shadow:0 0 0 2px var(--orange);}
.cal-cell.cal-today{border-color:var(--orange-dark);border-width:2px;}
.cal-cell.has{background:var(--orange-25);}
.cal-n{font-size:12px;color:var(--ink-soft);}
.cal-sp-wrap{flex:1;display:flex;align-items:baseline;gap:5px;margin-top:4px;}
.cal-sp{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;line-height:1;color:var(--ink);}
.cal-sp-lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;}
.cal-clients{font-size:10.5px;color:var(--ink-soft);line-height:1.35;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-none{color:var(--ink-soft);font-size:12px;margin-top:8px;}
@media(max-width:640px){.cal-sp{font-size:19px;}.cal-cell{min-height:64px;padding:6px 8px;}.cal-clients{display:none;}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--orange);border-radius:8px;padding:14px 16px;}
.kpi.danger{border-top-color:var(--danger);}
.kpis.cmp{margin-bottom:10px;gap:10px;}
.kpis.cmp .kpi{padding:10px 14px;}
.kpis.cmp .kpi-v{font-size:26px;}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr));}
/* Fenêtres peu larges : l'en-tête reste entièrement visible */
@media (max-width:1180px){
  .hdr{grid-template-columns:230px 1fr auto auto;}
  .hdr-brand{padding:0 10px;}
  .hdr-brand img{height:68px;}
  .nav-btn{padding:0 9px;font-size:10.5px;}
  .nav-btn-ico{font-size:20px;}
  .hdr-right{padding:0 12px;}
  .hdr-clock{font-size:26px;}
  .hdr-user select{max-width:96px;}
  .page{padding-left:20px;padding-right:20px;}
}
@media (max-width:860px){
  .hdr{grid-template-columns:150px 1fr auto auto;}
  .hdr-brand{padding:0 8px;}
  .hdr-brand img{height:48px;}
  .nav-btn-txt{font-size:9.5px;}
}
/* Fenêtres peu hautes : en-tête et cartes plus compacts pour que les encarts restent visibles */
@media (max-height:700px){
  :root{--hdr-h:76px;}
  .hdr-clock{font-size:26px;}
  .hdr-role{display:none;}
  .nav-btn{gap:3px;padding:0 16px;}
  .nav-btn-ico{font-size:18px;}
  .badge{top:10px;}
  .hdr-brand img{height:56px;}
  .page{padding-top:16px;}
  .kpis.cmp .kpi{padding:6px 12px;}
  .kpis.cmp .kpi-v{font-size:20px;}
  .kpis.cmp .kpi-s{font-size:10.5px;}
  .box{padding:12px 14px;margin-bottom:14px;}
  .box-h{margin-bottom:8px;}
}
.kpis.k6 .kpi-v{font-size:25px;}
@media(max-width:1000px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi-l{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
.kpi-v{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;line-height:1.1;margin-top:2px;}
.kpi-s{font-size:11.5px;color:var(--ink-soft);}
.box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:20px;}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.box-h h2{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.box-h .sub{font-size:12px;color:var(--ink-soft);}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.bar .input,.bar .select select{font-size:13px;}
.table{font-size:12.5px;}
.table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);white-space:nowrap;background:#FFFBF4;}
.table td{vertical-align:middle;}
.table tr.clickable{cursor:pointer;}
.table tr.clickable:hover td{background:var(--orange-25);}
.table tfoot td,.table tfoot th{font-weight:800;background:#FFFBF4;color:var(--ink);}
.num{text-align:right !important;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tw{overflow-x:auto;}
.prog{width:90px;height:8px;border-radius:4px;background:#EEEAE2;overflow:hidden;display:inline-block;vertical-align:middle;}
.prog>i{display:block;height:100%;background:var(--orange);}
.prog.full>i{background:var(--ok);}
.aq-none{color:var(--ink-soft);}
.aq-sent{color:var(--danger);}                 /* envoyée à l'antenne : rouge */
.aq-conf{color:var(--danger);font-weight:800;} /* confirmée par l'antenne : rouge gras */
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:6px;margin-bottom:8px;border-left:4px solid var(--orange);background:#FFFBF4;cursor:pointer;}
.al.danger{border-left-color:var(--danger);background:#FDF0EE;}
.al.info{border-left-color:var(--orange-50);}
.al:hover{filter:brightness(.97);}
.al b{font-size:12px;}
.step{display:grid;grid-template-columns:32px 30px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:none;}
.step .ic{font-size:16px;text-align:center;}
.step small{color:var(--ink-soft);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:1000px){.grid2{grid-template-columns:1fr;}}
.tabs ul{border-bottom-color:var(--border);}
.tabs li.is-active a{color:var(--orange-dark);border-bottom-color:var(--orange);font-weight:700;}
.tabs a{color:var(--ink-soft);font-weight:600;cursor:pointer;}
.tabs a:hover{color:var(--ink);border-bottom-color:var(--orange-50);}
.mnav{display:flex;align-items:center;gap:10px;}
.mnav .ml{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;text-transform:uppercase;min-width:200px;text-align:center;}
.muted{color:var(--ink-soft);}
.empty{padding:26px;text-align:center;color:var(--ink-soft);border:2px dashed var(--border);border-radius:8px;}
.toast{position:fixed;right:20px;bottom:20px;z-index:500;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.18);}
.help{font-size:11.5px;}
/* Graphiques */
.chart svg{width:100%;height:auto;display:block;}
.chart text{font-family:'Inter',sans-serif;font-size:11px;fill:var(--ink-soft);}
.chart text.endlbl{fill:var(--ink);font-weight:700;}
.hit{fill:transparent;}
.hitg:hover .hit{fill:rgba(245,156,0,.09);}
.cross{stroke:var(--ink-soft);stroke-width:1;opacity:0;}
.hitg:hover .cross{opacity:.7;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink);margin-bottom:6px;}
.lg{display:inline-flex;align-items:center;gap:6px;}
.lg-sw{width:10px;height:10px;border-radius:2px;display:inline-block;}
.lg-line{width:16px;height:0;border-top:3px solid;display:inline-block;border-radius:2px;}
.chart-table{margin-top:6px;font-size:12px;}
.chart-table summary{cursor:pointer;color:var(--ink-soft);font-size:11.5px;}
#tip{position:fixed;z-index:600;pointer-events:none;background:#fff;border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:6px;padding:8px 10px;font-size:12px;display:none;min-width:170px;}
.tip-t{font-weight:800;margin-bottom:5px;}
.tip-r{display:flex;align-items:center;gap:8px;line-height:1.7;}
.tip-r .tip-n{flex:1;color:var(--ink-soft);}
.tip-k{width:12px;height:0;border-top:3px solid;display:inline-block;flex-shrink:0;}
.dl.up{color:var(--ok);font-weight:700;}
.dl.dn{color:var(--danger);font-weight:700;}
</style>
</head>

<script>
'use strict';
/* ==========================================================================
   1. OUTILS
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Formats français écrits à la main : certains navigateurs (Safari) ne mettent pas d'espace dans « 1450 » */
const fmtNum = (n, dec = 2) => { n = Number(n) || 0; const neg = n < 0 && Math.abs(n) >= Math.pow(10, -dec) / 2, s = Math.abs(n).toFixed(dec).split('.'); return (neg ? '-' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + (s[1] ? ',' + s[1] : ''); };
const eur = n => fmtNum(n, 2) + '\u00a0€';
const p2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const today = () => isoOf(new Date());
const fdate = s => s ? s.split('-').reverse().join('/') : '—';
const ymOf = s => (s || '').slice(0, 7);
const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const ymLabel = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const daysDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const addMonths = (ym, n) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + p2(m + 1); };
const round2 = n => Math.round((+n || 0) * 100) / 100;
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };

/* ==========================================================================
   2. BASE DE DONNÉES
   Stockage : navigateur (localStorage) via Store.
   Pour passer en multi-utilisateurs réel : remplacer Store.load / Store.save
   par des appels à une API (ex. Cloudflare Worker + D1). Toute la logique
   métier ci-dessous reste identique.
   ========================================================================== */
const Store = {
  KEY: 'commercial_tool_db_v1',
  blank() {
    return {
      v: 1,
      users: [
        { id: 'u1', name: 'Nicolas', role: 'admin', sellerId: '' },
        { id: 'u2', name: 'Nathalie', role: 'gestion', sellerId: '' },
        { id: 'u3', name: 'Commercial 1', role: 'commercial', sellerId: 's2' }
      ],
      sellers: [{ id: 's1', name: 'Radio Monaco (direct)', rate: 0, direct: true }, { id: 's2', name: 'Commercial 1', rate: 10, direct: false }],
      contracts: [], campaigns: [], bookings: [], invoices: [], tariffs: Store.defaultTariffs(),
      closures: {}, clientInfo: {}, odp: {}, settings: { tva: 20, payDelay: 30, remindDays: 7, checkDays: 7, antenna: 'Eric' }, log: []
    };
  },
  /* Grille tarifaire réelle de la régie, préchargée dès l'installation (modifiable ensuite dans Paramètres → Tarifs) */
  defaultTariffs() {
    const pack = (sub, name, price) => ({ id: uid(), name, kind: 'pack', unit: 'forfait', price, tiers: '', sub });
    return [
      { id: uid(), name: 'Spot floating 20\'s', kind: 'spot', unit: 'spot', price: 33, tiers: '36:30; 71:27; 106:23', sub: '' },
      { id: uid(), name: 'Création de spot 20 secondes', kind: 'autre', unit: 'forfait', price: 120, tiers: '', sub: '' },
      { id: uid(), name: 'Création de spot 30 secondes', kind: 'autre', unit: 'forfait', price: 150, tiers: '', sub: '' },
      // Offres Clés en main 2026 — 20 secondes (tarif net HT)
      pack('20s', 'Light 2 semaines — 50 spots', 1665),
      pack('20s', 'Regular 2 semaines — 70 spots', 2330),

/* ---- N° d'ODP : AAAA-#### séquentiel par année ---- */
const fmtOdp = (y, n) => y + '-' + String(n).padStart(4, '0');
function assignOdp(dateStr, type) {
  const y = dateStr.slice(0, 4);
  if (type === 'communication') {          // numérotation à part : ne doit jamais casser la suite officielle des ODP
    let n = (db.odp['COM' + y] || 0) + 1;
    while (db.contracts.some(c => c.odp === 'COM-' + y + '-' + String(n).padStart(3, '0'))) n++;
    db.odp['COM' + y] = n;
    return 'COM-' + y + '-' + String(n).padStart(3, '0');
  }
  let n = (db.odp[y] || 0) + 1;
  while (db.contracts.some(c => c.odp === fmtOdp(y, n))) n++;   // jamais de doublon
  db.odp[y] = n;
  return fmtOdp(y, n);
}

/* ---- Contrat ---- */
const campsOf = c => db.campaigns.filter(x => x.contractId === c.id);

/* Étapes du process. Certaines sont cochées à la main (avec leur date), les autres se déduisent des données.

function stepsOf(c) {

  const sent = camps.filter(x => x.antenne !== 'none').length, conf = camps.filter(x => x.antenne === 'confirmed').length;
  const closed = db.closures[ymOf(c.signedDate)];
  return [
    { k: 1, key: 'filed', manual: true, label: 'Contrat rangé dans le dossier (Dropbox / Drive)', status: c.filed ? 'done' : 'todo', detail: (c.files && c.files.length) ? c.files.length + ' fichier(s) importé(s)' : (c.driveUrl ? 'Lien renseigné' : '') },
    { k: 2, key: 'ca', label: 'CA signé enregistré à la date de signature', status: comm ? 'na' : signed ? 'done' : 'todo', detail: comm ? 'Sans objet (communication)' : signed ? ymLabel(ymOf(c.signedDate)) : 'après signature' },
    { k: 3, key: 'odp', label: "N° d'ODP attribué pour la facturation", status: c.odp ? 'done' : 'todo', detail: c.odp || '' },
    { k: 4, key: 'camps', label: 'Campagnes enregistrées au suivi', status: camps.length ? 'done' : 'todo', detail: camps.length + ' ligne(s)' },
    { k: 5, key: 'book', label: 'Émissions sponsorisées réservées', status: sp ? (bks.length ? 'done' : 'todo') : 'na', detail: sp ? bks.length + ' réservation(s)' : 'Sans objet (hors sponsoring)' },
    { k: 6, key: 'pay', label: 'Encaissement enregistré (campagne placée ou dates connues)', status: comm ? 'na' : invs.length ? 'done' : 'todo', detail: comm ? 'Sans objet (non facturée)' : invs.length + ' ligne(s)' },
    { k: 7, key: 'aquira', label: "Placée dans Aquira, envoyée puis confirmée par l'antenne", status: !camps.length ? 'todo' : conf === camps.length ? 'done' : sent > 0 ? 'partial' : 'todo', detail: camps.length ? sent + '/' + camps.length + ' envoyée(s) · ' + conf + ' confirmée(s)' : '' },
    { k: 8, key: 'close', label: 'CA signé reporté au suivi mensuel (clôture du mois)', status: comm ? 'na' : !signed ? 'todo' : closed ? 'done' : 'todo', detail: comm ? 'Sans objet (communication)' : closed ? 'Clôturé le ' + fdate(closed.closedAt.slice(0, 10)) : 'Mois non clôturé' }
  ];
}
function progressOf(c) {
  if (isLost(c)) return { done: 0, total: 0, pct: 0 };
  const st = stepsOf(c).filter(s => s.status !== 'na' && !(s.optional && s.status !== 'done'));
  const done = st.filter(s => s.status === 'done').length;
  return { done, total: st.length, pct: st.length ? Math.round(100 * done / st.length) : 100 };
}

/* ---- Facturation / encaissements ---- */
const invTva = i => (i.tva === undefined || i.tva === null || i.tva === '') ? db.settings.tva : +i.tva;
const invTTC = i => round2(i.amountHT * (1 + invTva(i) / 100));
const invPaid = i => round2(sum(i.payments || [], p => p.amount));
const invReste = i => round2(invTTC(i) - invPaid(i));
const invByMode = (i, m) => round2(sum((i.payments || []).filter(p => p.mode === m), p => p.amount));
const invOverdue = i => !!i.invoiceNo && invReste(i) > 0.005 && addDays(i.invoiceDate, db.settings.payDelay) < today();
function invStatus(i) {
  if (!i.invoiceNo) return { k: 'planned', l: 'Planifiée', cls: 'grey' };
  if (invReste(i) <= 0.005) return { k: 'paid', l: 'Soldée', cls: 'ok' };
  if (invOverdue(i)) return { k: 'late', l: 'En retard', cls: 'ko' };
  if (invPaid(i) > 0) return { k: 'partial', l: 'Partielle', cls: 'o25' };
  return { k: 'due', l: 'À encaisser', cls: 'o25' };
}
/* Commission acquise = taux × HT encaissé (au prorata des règlements reçus) */
function commAcquired(i) {
  if (!i.invoiceNo) return 0;
  const ttc = invTTC(i), ratio = ttc ? Math.min(1, invPaid(i) / ttc) : 0;
  return round2(i.amountHT * ratio * (+i.commRate || 0) / 100);
}
const commPaid = i => round2(sum(i.commPaid || [], p => p.amount));
const commDue = i => round2(commAcquired(i) - commPaid(i));

/* ---- Diffusion : répartition d'une campagne au prorata des jours ---- */
/* allocByMonth est désormais défini dans p2e.js (grille de diffusion) */

/* ---- CA SIGNÉ (tableau « CA signé par mois et par année ») ---- */
function caSigneYear(y) {
  const rows = Array.from({ length: 12 }, (_, i) => ({ ym: y + '-' + p2(i + 1), by: {}, total: 0, cum: 0, items: [] }));
  db.contracts.filter(c => isCA(c) && c.signedDate.startsWith(String(y))).forEach(c => {
    const r = rows[+c.signedDate.slice(5, 7) - 1];
    r.by[c.sellerId] = (r.by[c.sellerId] || 0) + c.amountHT;
    r.total += c.amountHT; r.items.push(c);
  });
  let cum = 0; rows.forEach(r => { cum += r.total; r.cum = cum; });
  return rows;
}

/* ---- Diffusion d'un contrat mois par mois : facturé (b), diffusé réel (d), à rajouter (adj) ---- */
function contractDiffMonths(c) {
  const camps = campsOf(c), billed = {}, diff = {}, out = {};
  invsOf(c).filter(i => i.invoiceNo).forEach(i => { const k = ymOf(i.invoiceDate); billed[k] = (billed[k] || 0) + i.amountHT; });
  camps.forEach(cp => { const a = allocByMonth(cp); Object.keys(a).forEach(k => { diff[k] = (diff[k] || 0) + a[k]; }); });
  new Set([...Object.keys(billed), ...Object.keys(diff)]).forEach(k => {
    const b = billed[k] || 0, d = diff[k] || 0, adj = camps.length ? d - b : 0;
    if (Math.abs(b) < 0.005 && Math.abs(adj) < 0.005) return;
    out[k] = { b, d, adj };
  });
  return out;
}
/* ---- CA DIFFUSÉ = facturé du mois + « à rajouter » (mis en cache le temps d'un affichage) ---- */
let DC = {};
function caDiffuseYear(y) {
  if (DC[y]) return DC[y];
  const rows = Array.from({ length: 12 }, (_, i) => ({ ym: y + '-' + p2(i + 1), billed: 0, adj: 0, total: 0, cum: 0, detail: [] }));
  db.contracts.filter(isCA).forEach(c => {
    const m = contractDiffMonths(c);
    Object.keys(m).forEach(k => {
      if (!k.startsWith(String(y))) return;
      const v = m[k], r = rows[+k.slice(5, 7) - 1];
      r.billed += v.b; r.adj += v.adj; r.total += v.b + v.adj; r.detail.push({ c, b: v.b, d: v.d, adj: v.adj });
    });
  });
  let cum = 0; rows.forEach(r => { r.billed = round2(r.billed); r.adj = round2(r.adj); r.total = round2(r.total); cum += r.total; r.cum = round2(cum); });
  return (DC[y] = rows);
}
const caSigneMonth = ym => round2(sum(db.contracts.filter(c => isCA(c) && ymOf(c.signedDate) === ym), c => c.amountHT));
const caDiffuseMonth = ym => caDiffuseYear(+ym.slice(0, 4))[+ym.slice(5, 7) - 1].total;
/* Encaissé du mois (TTC, à la date de règlement) */
const caEncaisseMonth = ym => round2(sum(db.invoices, i => sum((i.payments || []).filter(p => ymOf(p.date) === ym), p => p.amount)));
/* Reste à diffuser : part des campagnes planifiées après aujourd'hui + partie du contrat pas encore planifiée */
function campRemaining(cp) {
  const t = today(); if (!cp.start || !cp.end || cp.end <= t) return 0;
  if (cp.start > t) return +cp.amountHT || 0;
  return (+cp.amountHT || 0) * daysDiff(t, cp.end) / (daysDiff(cp.start, cp.end) + 1);
}
const resteDiffuser = c => { const cs = campsOf(c); return round2(sum(cs, campRemaining) + Math.max(0, c.amountHT - sum(cs, x => x.amountHT))); };

/* ---- Clôture mensuelle (point 8) ---- */
function closeMonth(ym) {
  const cur = today().slice(0, 7);
  if (ym >= cur) return toast('Un mois ne peut être clôturé qu\'une fois terminé.', 'danger');
  if (db.closures[ym] && !confirm('Ce mois est déjà clôturé. Remplacer le relevé figé par les chiffres actuels ?')) return;
  const warns = [];
  const pending = db.campaigns.filter(cp => ymOf(cp.start) === ym && cp.antenne !== 'confirmed').length;
  if (pending) warns.push(pending + ' campagne(s) du mois non confirmée(s) par l\'antenne');
  const noInv = db.invoices.filter(i => ymOf(i.invoiceDate) === ym && !i.invoiceNo).length;
  if (noInv) warns.push(noInv + ' facture(s) du mois sans n° de facture');
  if (warns.length && !confirm('Points non résolus :\n- ' + warns.join('\n- ') + '\n\nClôturer quand même ' + ymLabel(ym) + ' ?')) return;
  db.closures[ym] = { closedAt: new Date().toISOString(), by: me().name, caSigne: caSigneMonth(ym), caDiffuse: caDiffuseMonth(ym), encaisse: caEncaisseMonth(ym) };
  audit('Clôture', 'Mois', ym, 'CA signé ' + eur(db.closures[ym].caSigne) + ' · CA diffusé ' + eur(db.closures[ym].caDiffuse));
  commit(); toast('Mois clôturé : ' + ymLabel(ym));
}
function reopenMonth(ym) {

  delete db.closures[ym]; audit('Réouverture', 'Mois', ym, ''); commit();
}
const closureDrift = ym => { const c = db.closures[ym]; return c && (Math.abs(c.caSigne - caSigneMonth(ym)) > 0.01 || Math.abs(c.caDiffuse - caDiffuseMonth(ym)) > 0.01); };

/* ---- Relances d'impayés ---- */
const lastReminder = i => (i.reminders || []).slice().sort((a, b) => b.date.localeCompare(a.date) || 0)[0];
function relanceDue(i) {        // une relance est à faire si aucune n'a eu lieu, si la date prévue est atteinte, ou si la dernière est trop ancienne
  const l = lastReminder(i), t = today();
  if (!l) return true;
  return l.next ? l.next <= t : daysDiff(l.date, t) >= cfg('remindDays', 7);
}

/* ---- Alertes ---- */
function computeAlerts() {
  const A = [], t = today(), cur = t.slice(0, 7), day = +t.slice(8, 10);
  const vis = visContracts(), sig = vis.filter(isSigned), ids = new Set(sig.map(c => c.id));
  const push = (lvl, txt, cid) => A.push({ lvl, txt, cid });
  vis.filter(isProp).forEach(c => {
    const age = daysDiff(c.proposalDate || c.signedDate, t), tag = c.odp + ' · ' + c.client;
    if (age >= 15) push('info', tag + ' : proposition sans signature depuis ' + age + ' j', c.id);
  });
  sig.forEach(c => {
    const st = stepsOf(c), tag = (c.odp || '—') + ' · ' + c.client, age = daysDiff(c.signedDate, t), camps = campsOf(c);
    const late = st.filter(s => ['filed', 'camps', 'book', 'pay'].includes(s.key) && s.status === 'todo' && !(s.key === 'pay' && !camps.length)).map(s => s.k);
    if (age >= 3 && late.length) push('warning', tag + ' : étape(s) ' + late.join(', ') + ' à compléter (signé il y a ' + age + ' j)', c.id);
    if (camps.length && !isComm(c)) {
      const ecart = round2(sum(camps, x => x.amountHT) - c.amountHT);
      if (Math.abs(ecart) > 0.01) push('danger', tag + ' : campagnes (' + eur(sum(camps, x => x.amountHT)) + ') ≠ contrat (' + eur(c.amountHT) + ')', c.id);
    }
    const invs = invsOf(c);
    if (invs.length) {
      const e2 = round2(sum(invs, i => i.amountHT) - c.amountHT);
      if (e2 > 0.01) push('danger', tag + ' : facturé HT supérieur au montant du contrat (+' + eur(e2) + ')', c.id);
    }
    if (c.type === 'sponsoring' && !bksOf(c).length && age >= 1) push('warning', tag + ' : sponsoring sans réservation d\'émission', c.id);
    if (!isComm(c) && camps.some(x => x.antenne !== 'none') && !invs.length) push('warning', tag + ' : campagne placée mais aucun encaissement enregistré', c.id);
  });
  db.campaigns.filter(x => ids.has(x.contractId)).forEach(cp => {
    const c = contractOf(cp.contractId), tag = (c.odp || '—') + ' · ' + c.client + ' · ' + cp.label;
    const d = daysDiff(t, cp.start);
    if (cp.antenne === 'none' && cp.end >= t && d <= 7) push(d <= 0 ? 'danger' : 'warning', tag + (d <= 0 ? ' : en cours de diffusion mais non placée dans Aquira' : ' : démarre dans ' + d + ' j, non placée'), c.id);
    if (cp.antenne === 'sent' && cp.sentDate && daysDiff(cp.sentDate, t) >= 2) push('warning', tag + ' : confirmation antenne attendue depuis le ' + fdate(cp.sentDate), c.id);
    if (cp.antenne !== 'none' && cp.start <= t && cp.end >= t && (!cp.lastCheck || daysDiff(cp.lastCheck, t) > cfg('checkDays', 7)))
      push('warning', tag + ' : vérification auprès de ' + antName() + ' à faire' + (cp.lastCheck ? ' (dernière le ' + fdate(cp.lastCheck) + ')' : ''), c.id);
  });
  db.invoices.filter(i => ids.has(i.contractId)).forEach(i => {
    const c = contractOf(i.contractId), tag = c.client + ' · ' + (i.invoiceNo ? 'facture ' + i.invoiceNo : 'facturation prévue');
    if (invOverdue(i)) {
      const l = lastReminder(i);
      if (relanceDue(i)) push('danger', tag + ' : impayée, reste ' + eur(invReste(i)) + ' — relance à faire' + (l ? ' (dernière le ' + fdate(l.date) + ')' : ' (aucune relance)'), c.id);
      else push('info', tag + ' : impayée, reste ' + eur(invReste(i)) + ' — relancée le ' + fdate(l.date) + (l.next ? ', prochaine le ' + fdate(l.next) : ''), c.id);
    }
    if (!i.invoiceNo && i.invoiceDate <= t) push('warning', tag + ' : facture à émettre (prévue le ' + fdate(i.invoiceDate) + ')', c.id);
  });
  if (isMgr()) {
    if (day >= 10 && day <= 20) {
      const nx = addMonths(cur, 1), n = db.campaigns.filter(x => ymOf(x.start) === nx).length;
      push('info', 'Préparer ' + ymLabel(nx) + ' : ' + n + ' campagne(s) démarrent le mois prochain (le suivi du mois suivant se crée vers le 15)');
    }
    const prev = addMonths(cur, -1);
    if (day <= 10 && db.contracts.some(isCA) && !db.closures[prev]) push('warning', 'Clôture de ' + ymLabel(prev) + ' à faire : reporter le CA signé et le CA diffusé au suivi mensuel');
    Object.keys(db.closures).forEach(ym => { if (closureDrift(ym)) push('danger', ymLabel(ym) + ' : chiffres modifiés depuis la clôture (relevé figé ≠ calcul actuel)'); });
  }
  const o = { danger: 0, warning: 1, info: 2 };
  return A.sort((a, b) => o[a.lvl] - o[b.lvl]);
}

const clientKey = n => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');

function clientsList() {
  const map = {};

/* Chiffres d'un client, année par année (les années sans activité entre la première et la dernière sont incluses).
   Les propositions ne comptent pas dans le CA ; les campagnes de communication comptent dans les spots mais pas dans le CA. */
function clientStats(contracts) {
  const Y = {}, row = y => (Y[y] = Y[y] || { y: String(y), n: 0, camps: 0, signe: 0, diffuse: 0, billed: 0, paid: 0, spots: 0 });
  let reste = 0, rd = 0, pend = 0, count = 0, first = '', last = '';
  contracts.forEach(c => {
    if (isProp(c)) { pend += c.amountHT; return; }
    if (isLost(c)) return;
    count++;
    const ca = isCA(c);
    if (!first || c.signedDate < first) first = c.signedDate;
    if (!last || c.signedDate > last) last = c.signedDate;
    if (ca) {
      const r = row(c.signedDate.slice(0, 4)); r.n++; r.signe += c.amountHT;
      const dm = contractDiffMonths(c);
      Object.keys(dm).forEach(k => { row(k.slice(0, 4)).diffuse += dm[k].b + dm[k].adj; });
      rd += resteDiffuser(c);
      invsOf(c).forEach(i => {
        if (i.invoiceNo) { row(i.invoiceDate.slice(0, 4)).billed += i.amountHT; reste += invReste(i); }
        (i.payments || []).forEach(p => { row(p.date.slice(0, 4)).paid += p.amount; });
      });
    }
    campsOf(c).forEach(cp => {
      const a = allocByMonth(cp), s = allocByMonth(cp, 'spots');
      new Set(Object.keys(a).map(k => k.slice(0, 4))).forEach(yy => { row(yy).camps++; });
      Object.keys(s).forEach(k => { row(k.slice(0, 4)).spots += s[k]; });
    });
  });
  const ys = Object.keys(Y).map(Number);
  if (ys.length) for (let y = Math.min(...ys); y <= Math.max(...ys); y++) row(y);
  const rows = Object.values(Y).sort((a, b) => a.y.localeCompare(b.y));
  const tot = rows.reduce((t, r) => ({ n: t.n + r.n, signe: t.signe + r.signe, diffuse: t.diffuse + r.diffuse, billed: t.billed + r.billed, paid: t.paid + r.paid, spots: t.spots + r.spots }), { n: 0, signe: 0, diffuse: 0, billed: 0, paid: 0, spots: 0 });
  return { rows, tot, reste: round2(reste), rd: round2(rd), pend, count, first, last, byYear: y => Y[y] || { n: 0, signe: 0, diffuse: 0, billed: 0, paid: 0, spots: 0, camps: 0 } };
}
const pct = (a, b) => b > 0.005 ? ((a - b) / b * 100) : null;
const fpct = v => v === null ? '—' : (v >= 0 ? '+' : '') + v.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %';

function niceScale(max) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), nm = raw / mag;
  const step = (nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10) * mag, top = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  return { max: top, ticks };
}
/* Dimensions : le graphique épouse la largeur de son encart et tient dans la hauteur de la fenêtre */
const chartW = (el, half) => { const w = (el && el.clientWidth) || 900; const inner = el && el.classList && el.classList.contains('modal-card-body') ? w - 40 : w - 80; return Math.max(320, Math.round(half ? (inner - 20) / 2 - 38 : inner - 38)); };
const chartH = () => Math.max(140, Math.min(340, window.innerHeight - (window.innerHeight < 700 ? 420 : 450)));
const tipAttr = (title, rows) => esc(JSON.stringify({ t: title, r: rows }));
function legendHtml(series, kind) {

}
function chartTable(cats, series, fmt, first) {
  return '<details class="chart-table"><summary>Voir les données (tableau)</summary><div class="tw"><table class="table is-narrow is-fullwidth"><thead><tr><th>' + esc(first || '') + '</th>' + series.map(s => '<th class="num">' + esc(s.name) + '</th>').join('') + '</tr></thead><tbody>' +

/* Colonnes groupées. o = { cats, series:[{name,color,vals,from}], fmtTick, fmtVal, tipTitle(i), h, first } */
function barChart(o) {
  const W = o.w || 760, H = o.h || 270, m = { l: 58, r: 14, t: 14, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const mx = Math.max(0, ...o.series.flatMap(s => s.vals.filter(v => v != null))), sc = niceScale(mx);
  const y = v => m.t + ph - (v / sc.max) * ph, n = o.cats.length, band = pw / n, k = o.series.length;
  const bw = Math.min(24, (band * .72 - (k - 1) * 2) / k), gw = k * bw + (k - 1) * 2;
  let g = '';
  sc.ticks.forEach(t => { g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--border)"/><text x="' + (m.l - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + o.fmtTick(t) + '</text>'; });
  o.cats.forEach((c, i) => {
    const x0 = m.l + i * band + (band - gw) / 2;
    o.series.forEach((s, j) => {
      const v = s.vals[i]; if (v == null || v <= 0.005) return;
      const x = x0 + j * (bw + 2), top = y(v), h = m.t + ph - top, r = Math.min(4, h, bw / 2), fut = s.from != null && i >= s.from;
      g += '<path d="M' + x + ' ' + (m.t + ph) + 'V' + (top + r) + 'Q' + x + ' ' + top + ' ' + (x + r) + ' ' + top + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + top + ' ' + (x + bw) + ' ' + (top + r) + 'V' + (m.t + ph) + 'Z" fill="' + s.color + '"' + (fut ? ' opacity=".45"' : '') + '/>';
    });
    g += '<text x="' + (m.l + i * band + band / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(c) + '</text>';
  });
  o.cats.forEach((c, i) => {
    const rows = o.series.map(s => [s.name + (s.from != null && i >= s.from ? ' (prévu)' : ''), s.color, s.vals[i] == null ? '—' : o.fmtVal(s.vals[i])]);
    g += '<g class="hitg"><rect class="hit" x="' + (m.l + i * band) + '" y="' + m.t + '" width="' + band + '" height="' + ph + '" data-tip="' + tipAttr(o.tipTitle ? o.tipTitle(i) : c, rows) + '"/></g>';
  });
  return '<div class="chart">' + (k > 1 ? legendHtml(o.series, 'bar') : '') + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Graphique') + '">' + g + '</svg>' + chartTable(o.cats, o.series, o.fmtVal, o.first) + '</div>';
}
/* Courbes. Les valeurs null interrompent la courbe (mois à venir). */
function lineChart(o) {
  const W = 760, H = o.h || 270, m = { l: 58, r: 24, t: 20, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const mx = Math.max(0, ...o.series.flatMap(s => s.vals.filter(v => v != null))), sc = niceScale(mx);
  const y = v => m.t + ph - (v / sc.max) * ph, n = o.cats.length, band = pw / n, x = i => m.l + band * (i + .5);
  let g = '';
  sc.ticks.forEach(t => { g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--border)"/><text x="' + (m.l - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + o.fmtTick(t) + '</text>'; });
  o.cats.forEach((c, i) => { g += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(c) + '</text>'; });
  o.series.slice().reverse().forEach(s => {           // la série principale (index 0) est dessinée en dernier, donc au-dessus
    let d = '', pen = false, lastI = -1;
    s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i) + ' ' + y(v); pen = true; lastI = i; });
    g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if (lastI >= 0) {
      g += '<circle cx="' + x(lastI) + '" cy="' + y(s.vals[lastI]) + '" r="4.5" fill="' + s.color + '" stroke="var(--card)" stroke-width="2"/>';
      if (s === o.series[0]) g += '<text class="endlbl" x="' + x(lastI) + '" y="' + (y(s.vals[lastI]) - 11) + '" text-anchor="' + (lastI >= n - 2 ? 'end' : 'middle') + '">' + o.fmtVal(s.vals[lastI]) + '</text>';
    }
  });
  o.cats.forEach((c, i) => {
    const rows = o.series.map(s => [s.name, s.color, s.vals[i] == null ? '—' : o.fmtVal(s.vals[i])]);
    g += '<g class="hitg"><line class="cross" x1="' + x(i) + '" x2="' + x(i) + '" y1="' + m.t + '" y2="' + (m.t + ph) + '"/><rect class="hit" x="' + (m.l + i * band) + '" y="' + m.t + '" width="' + band + '" height="' + ph + '" data-tip="' + tipAttr(o.tipTitle ? o.tipTitle(i) : c, rows) + '"/></g>';
  });
  return '<div class="chart">' + (o.series.length > 1 ? legendHtml(o.series, 'line') : '') + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Graphique') + '">' + g + '</svg>' + chartTable(o.cats, o.series, o.fmtVal, o.first) + '</div>';

/* ==========================================================================
   3d. COMPARATIF DU CA (année en cours vs N-1, mois vs mois-1, cumul, 12 mois glissants)
   ========================================================================== */
const MSHORT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
function vCompare(y, yearSel) {
  const CW = chartW($('#' + PAGE), false), CHT = chartH();
  const C = ST.cmp, cur = today(), curY = +cur.slice(0, 4), curM = +cur.slice(5, 7);
  const isCur = y === curY, anchorM = isCur ? curM : 12, anchorYm = y + '-' + p2(anchorM);
  const mval = ym => C.metric === 'signe' ? caSigneMonth(ym) : caDiffuseMonth(ym);
  const yr = yy => Array.from({ length: 12 }, (_, i) => mval(yy + '-' + p2(i + 1)));
  const yrs = [y, y - 1].concat(C.y2 ? [y - 2] : []), cols = [CH.cur, CH.prev, CH.prev2];
  const metricLbl = C.metric === 'signe' ? 'CA signé' : 'CA diffusé';
  let chart;
  if (C.view === 'roll') {
    const yms = Array.from({ length: 12 }, (_, i) => addMonths(anchorYm, i - 11));
    const s = [{ name: 'Mois concerné', color: CH.cur, vals: yms.map(mval) }, { name: 'Même mois l\'an passé', color: CH.prev, vals: yms.map(k => mval(addMonths(k, -12))) }];
    chart = barChart({ cats: yms.map(k => MSHORT[+k.slice(5) - 1] + ' ' + k.slice(2, 4)), series: s, fmtTick: kEur, fmtVal: eur, w: CW, h: CHT, tipTitle: i => ymLabel(yms[i]) + ' vs ' + ymLabel(addMonths(yms[i], -12)), label: metricLbl + ' : 12 derniers mois vs mêmes mois de l\'an passé', first: 'Mois' });
  } else {
    const s = yrs.map((yy, k) => {
      let v = yr(yy);
      const live = yy === curY;                                              // année en cours : mois à venir
      if (C.view === 'cumul') { let t = 0; v = v.map((x, i) => { t += x; return live && i >= curM ? null : round2(t); }); }
      return { name: String(yy), color: cols[k], vals: v, from: C.view === 'month' && live ? curM : null };
    });
    chart = C.view === 'cumul'
      ? lineChart({ cats: MSHORT, series: s, fmtTick: kEur, fmtVal: eur, w: CW, h: CHT, label: metricLbl + ' cumulé par année', first: 'Mois' })
      : barChart({ cats: MSHORT, series: s, fmtTick: kEur, fmtVal: eur, w: CW, h: CHT, tipTitle: i => MONTHS[i], label: metricLbl + ' par mois et par année', first: 'Mois' });
  }
  /* Cartes de variation */
  const ytd = yy => sum(Array.from({ length: anchorM }, (_, i) => i), i => mval(yy + '-' + p2(i + 1)));
  const rolling = (ym, back) => sum(Array.from({ length: 12 }, (_, i) => i), i => mval(addMonths(ym, -i - back)));
  const prevYm = addMonths(anchorYm, -1), lastYm = addMonths(anchorYm, -12);

    const p = pct(now, base), d = round2(now - base), up = d >= 0;
    const dl = base <= 0.005 ? '<span class="muted">' + (now > 0.005 ? 'Pas de référence' : '—') + '</span>' : '<span class="dl ' + (up ? 'up' : 'dn') + '">' + (up ? '▲' : '▼') + ' ' + fpct(p) + ' <small>(' + (up ? '+' : '') + eur(d) + ')</small></span>';
    return '<div class="kpi"><div class="kpi-l">' + label + '</div><div class="kpi-v">' + eur(now) + '</div><div class="kpi-s">' + dl + '<br>' + ctx + ' : ' + eur(base) + '</div></div>';
  };
  const cards = card('Mois vs mois précédent', mval(anchorYm), mval(prevYm), esc(ymLabel(prevYm))) +
    card('Mois vs même mois N-1', mval(anchorYm), mval(lastYm), esc(ymLabel(lastYm))) +
    card('Cumul depuis janvier vs N-1', ytd(y), ytd(y - 1), 'Janv.–' + MSHORT[anchorM - 1] + ' ' + (y - 1)) +
    card('12 derniers mois vs 12 précédents', rolling(anchorYm, 0), rolling(anchorYm, 12), '12 mois précédents');
  const tg = (grp, key, val, label) => '<button class="button is-small ' + (C[key] === val ? 'is-primary' : '') + '" onclick="ST.cmp.' + key + '=\'' + val + '\';renderAll()">' + label + '</button>';
  return '<div class="box"><div class="box-h"><h2>Comparatif · ' + metricLbl + '</h2><div class="bar" style="margin:0">' + yearSel + '<div class="buttons has-addons mb-0">' + tg('', 'metric', 'signe', 'CA signé') + tg('', 'metric', 'diffuse', 'CA diffusé') + '</div>' +
    '<div class="buttons has-addons mb-0">' + tg('', 'view', 'month', 'Par mois') + tg('', 'view', 'cumul', 'Cumulé') + tg('', 'view', 'roll', '12 mois glissants') + '</div>' +
    (C.view === 'roll' ? '' : '<label class="checkbox"><input type="checkbox" ' + (C.y2 ? 'checked' : '') + ' onchange="ST.cmp.y2=this.checked;renderAll()"> ajouter ' + (y - 2) + '</label>') + '</div></div>' +
    '<div class="kpis cmp">' + cards + '</div>' + chart +
    '<p class="help muted mt-2">' + (isCur ? 'Repère : ' + ymLabel(anchorYm) + ' (mois en cours, partiel). ' : '') + (C.metric === 'diffuse' ? 'Les mois à venir affichent la diffusion déjà planifiée (colonnes estompées).' : 'Le CA signé est daté du jour de signature du contrat.') + '</p></div>';
}

/* ==========================================================================
   3f. DROPBOX : import du contrat signé
   Envoi direct depuis le navigateur vers l'API Dropbox (files/upload).
   Le jeton est saisi dans Paramètres, reste dans ce navigateur et n'est
   jamais inclus dans les exports JSON.

const dbx = () => (db.settings.dropbox = db.settings.dropbox || { token: '', folder: '/Contrats' });
const dbxReady = () => !!(dbx().token || '').trim();
const cleanName = s => String(s || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim();
function dbxFolder() { let f = (dbx().folder || '').trim().replace(/\\/g, '/').replace(/\/+$/, ''); if (f && !f.startsWith('/')) f = '/' + f; return f; }
const dbxPath = (c, ext) => dbxFolder() + '/' + c.signedDate.slice(0, 4) + '/' + cleanName(c.odp + ' - ' + c.client + ' - ' + c.label).slice(0, 150) + ext;
/* Dropbox exige que les caractères non ASCII de l'en-tête Dropbox-API-Arg soient échappés en \uXXXX */
const dbxArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, ch => '\\u' + ('0000' + ch.charCodeAt(0).toString(16)).slice(-4));
function dbxErr(status, j) {
  if (status === 401) return 'Jeton Dropbox refusé ou expiré : renouvelez-le dans Paramètres.';
  if (status === 403) return 'Droits insuffisants : activez la permission files.content.write sur l\'application Dropbox.';
  if (status === 429) return 'Dropbox est saturé, réessayez dans un instant.';

function dbxUpload(file, path, onProgress) {
  return new Promise((resolve, reject) => {

    x.open('POST', 'https://content.dropboxapi.com/2/files/upload');
    x.setRequestHeader('Authorization', 'Bearer ' + dbx().token.trim());
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.setRequestHeader('Dropbox-API-Arg', dbxArg({ path, mode: 'add', autorename: true, mute: false }));
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) { /* réponse non JSON */ } x.status >= 200 && x.status < 300 ? resolve(j) : reject(new Error(dbxErr(x.status, j))); };
    x.onerror = () => reject(new Error('Connexion à Dropbox impossible (réseau ou navigateur).'));
    x.send(file);

}
async function dbxTest() {
  if (!dbxReady()) return errBox('Renseignez d\'abord le jeton Dropbox.');
  try {
    const r = await fetch('https://api.dropboxapi.com/2/users/get_current_account', { method: 'POST', headers: { Authorization: 'Bearer ' + dbx().token.trim() } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return errBox(dbxErr(r.status, j));
    toast('Dropbox connecté : ' + ((j.name && j.name.display_name) || 'compte OK'));
  } catch (e) { errBox('Connexion à Dropbox impossible (réseau ou navigateur).'); }
}
const DBX_EXT = ['.pdf', '.doc', '.docx', '.jpg', '.jpeg', '.png'], DBX_MAX = 150 * 1024 * 1024;
function dropboxDialog(cid) {
  const c = contractOf(cid); if (!c) return;

    '<div class="dropzone" id="dz"><div style="font-size:30px;line-height:1">📎</div><div id="dz-txt"><b>Glissez le contrat ici</b><br><small>ou cliquez pour choisir un fichier (PDF, Word, image · 150 Mo max)</small></div><input type="file" id="dz-in" hidden accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></div>' +
    '<p class="help mt-2">Destination : <code id="dz-path">' + esc(dbxPath(c, '.pdf')) + '</code></p><progress class="progress is-small mt-2" id="dz-pg" value="0" max="100" style="display:none"></progress><p class="help" id="dz-msg"></p>';
  const h = openModal({
    title: 'Importer dans Dropbox', body, buttons: [
      { label: 'Importer', cls: 'is-primary', onClick: () => run() },

  const el = h.el, btn = $('.modal-card-foot .is-primary', el), dz = $('#dz', el), inp = $('#dz-in', el), msg = $('#dz-msg', el), pg = $('#dz-pg', el);

    if (!DBX_EXT.includes(ext)) return say('Format non accepté (PDF, Word ou image).', true);
    if (f.size > DBX_MAX) return say('Fichier trop volumineux (150 Mo maximum).', true);
    file = f; say('');
    dz.classList.add('has'); $('#dz-txt', el).innerHTML = '<b>' + esc(f.name) + '</b><br><small>' + (f.size / 1048576).toFixed(2).replace('.', ',') + ' Mo · cliquez pour changer</small>';
    $('#dz-path', el).textContent = dbxPath(c, ext);
    btn.disabled = !ready;

  ['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('over'); }));

    if (!file || !ready) return;

      c.filed = true;

      commit(); toast('Contrat importé dans Dropbox'); h.close();
    } catch (e) { say(e.message, true); pg.style.display = 'none'; btn.disabled = false; }
  }
}

/* ==========================================================================
   TARIFS : grille configurable (spots, sponsoring, autres) + calcul automatique du montant
   Les montants déjà saisis ne changent jamais quand un tarif est modifié.
   ========================================================================== */
const T_KINDS = [{ v: 'spot', l: 'Prix par spot' }, { v: 'sponsoring', l: 'Prix sponsoring' }, { v: 'pack', l: 'Pack clés en main' }, { v: 'autre', l: 'Autre' }];
const kindLabel = k => (T_KINDS.find(x => x.v === k) || {}).l || k;
/* Regroupe les tarifs par type, puis par sous-groupe optionnel (t.sub, ex. « 20s »/« 30s »)
   quand au moins un tarif du type en a un — sert au menu du calcul automatique et à Paramètres. */
function tariffGroups() {
  const ts = tariffs(), out = [];
  T_KINDS.forEach(k => {
    const g = ts.filter(t => t.kind === k.v); if (!g.length) return;
    const subs = [...new Set(g.map(t => t.sub || ''))];
    if (subs.length === 1 && !subs[0]) { out.push({ label: k.l, list: g }); return; }
    subs.forEach(s => out.push({ label: s ? k.l + ' · ' + s : k.l, list: g.filter(t => (t.sub || '') === s) }));
  });
  return out;
}
const T_UNITS = [{ v: 'spot', l: 'par spot' }, { v: 'jour', l: 'par jour' }, { v: 'semaine', l: 'par semaine' }, { v: 'mois', l: 'par mois' }, { v: 'forfait', l: 'forfait' }];
const tariffs = () => db.tariffs || (db.tariffs = []);
const tariffOf = id => tariffs().find(t => t.id === id);
const unitLabel = u => (T_UNITS.find(x => x.v === u) || {}).l || u;
/* « 36:30; 71:27; 106:23 » = tarif au palier : dès 36 unités le prix devient 30 €/unité (flat,
   appliqué à la totalité de la quantité, pas seulement à la tranche), dès 71 → 27 €/unité, etc.
   En dessous du premier palier, c'est le tarif de base (t.price) qui s'applique. */
function parseTiers(s) {
  return String(s || '').split(/[;,]/).map(x => x.trim().split(':')).filter(a => a.length === 2).map(a => ({ min: num(a[0]), price: num(a[1]) }))
    .filter(t => t.min > 0 && t.price >= 0).sort((a, b) => a.min - b.min);
}
function tariffPrice(t, qty, disc) {
  const q = num(qty), tier = parseTiers(t.tiers).filter(x => q >= x.min).pop(), unitPrice = tier ? tier.price : t.price;
  const d1 = t.price > 0 ? round2((1 - unitPrice / t.price) * 100) : 0, d2 = Math.min(100, Math.max(0, num(disc)));
  const gross = round2(unitPrice * q);
  return { q, unitPrice, gross, d1, d2, net: round2(gross * (1 - d2 / 100)), tiered: !!tier };
}
function qtyFromDates(unit, s, e) {
  const days = daysDiff(s, e) + 1; if (!(days > 0)) return '';
  return unit === 'jour' ? days : unit === 'semaine' ? Math.ceil(days / 7) : Math.round(days / 30.4 * 10) / 10;
}
const pricingText = p => { const t = tariffOf(p.tid); return (t ? t.name : 'tarif supprimé') + ' × ' + p.qty + (num(p.disc) ? ' − ' + p.disc + ' %' : ''); };
const soleSpotTariffId = () => { const g = tariffs().filter(t => t.kind === 'spot'); return g.length === 1 ? g[0].id : ''; };
/* Déclenche le calcul (et l'affichage) une première fois à l'ouverture d'un formulaire, pour un tarif déjà présélectionné */
function initCalc(formEl) { if (formEl && $('.tcalc', formEl)) window.tarifCalc(formEl); }
/* preselTid : tarif à présélectionner à l'ouverture du formulaire (ex. celui déjà utilisé en
   édition, ou l'unique tarif « Prix par spot » dans un formulaire de campagne) — la saisie du
   nombre de spots applique alors directement le tarif dégressif, sans avoir à choisir un tarif à
   la main ni cliquer sur « Utiliser ce montant ». */
function calcHtml(preselTid) {
  const ts = tariffs();
  if (!ts.length) return '<div class="notification is-light py-3 mb-3">Aucun tarif configuré : ajoutez-les dans <b>Paramètres → Tarifs</b> pour calculer les montants automatiquement.</div>';
  const presel = preselTid || '';
  const tidSel = '<div class="field"><label class="label is-small">Tarif</label><div class="control"><div class="select is-fullwidth"><select name="tid" onchange="tarifCalc(this.form)"><option value="">— Choisir un tarif —</option>' +
    tariffGroups().map(g => '<optgroup label="' + esc(g.label) + '">' + g.list.map(t => '<option value="' + t.id + '"' + (t.id === presel ? ' selected' : '') + '>' + esc(t.name) + ' · ' + eur(t.price) + (t.unit === 'forfait' ? '' : ' ' + unitLabel(t.unit)) + '</option>').join('') + '</optgroup>').join('') +
    '</select></div></div></div>';
  return '<div class="box tcalc" style="background:var(--hdr-bg)"><div class="box-h"><h2>Calcul automatique du montant</h2><span class="sub">' + (presel ? 'Le nombre de spots applique le tarif automatiquement' : 'Optionnel — le montant reste modifiable') + '</span></div><div class="columns is-multiline">' +

/* ==========================================================================
   GRILLE DE DIFFUSION : répartition réelle mois par mois d'une campagne
   Le CA diffusé se répartit désormais au prorata des spots réellement
   diffusés chaque mois (saisis dans la grille), et non plus au prorata
   théorique des jours. Tant qu'un mois n'a pas été saisi, une estimation
   par jours (comme avant) sert de valeur par défaut, modifiable à tout
   moment par la gestion — au fil de la diffusion réelle.
   ========================================================================== */
function monthsTouched(camp) {
  if (!camp.start || !camp.end || camp.end < camp.start) return [];
  const s = new Date(camp.start + 'T00:00:00'), e = new Date(camp.end + 'T00:00:00');
  const out = []; const d = new Date(s.getFullYear(), s.getMonth(), 1);
  while (d <= e) { out.push(d.getFullYear() + '-' + p2(d.getMonth() + 1)); d.setMonth(d.getMonth() + 1); }
  return out;
}
function daysInCampMonth(camp, ym) {
  const s = new Date(camp.start + 'T00:00:00'), e = new Date(camp.end + 'T00:00:00');
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  const ms = new Date(y, m - 1, 1), me = new Date(y, m, 0);
  const from = s > ms ? s : ms, to = e < me ? e : me;
  return Math.max(0, Math.round((to - from) / 864e5) + 1);
}
/* Estimation par défaut (avant toute saisie manuelle) : prorata des jours */
function estSpotsForMonth(camp, ym) {
  const months = monthsTouched(camp); if (!months.length) return 0;
  const totalDays = sum(months, x => daysInCampMonth(camp, x)); if (!totalDays) return 0;
  return (num(camp.spots) || 0) * daysInCampMonth(camp, ym) / totalDays;
}
const gridManual = (camp, ym) => !!(camp.grid && camp.grid[ym] !== undefined && camp.grid[ym] !== null && camp.grid[ym] !== '');
const gridSpots = (camp, ym) => gridManual(camp, ym) ? num(camp.grid[ym]) : estSpotsForMonth(camp, ym);

/* ---------- Tranches horaires (saisies avec la grille de diffusion) ----------
   Floating : 9h00-16h00 · Semi floating : 9h00-19h00. Saisi mois par mois en
   même temps que la grille de diffusion ; le total des deux tranches
   redéfinit automatiquement le nombre de spots réels du mois (camp.grid[ym]). */
const SEGMENTS = [{ key: 'floating', label: 'Floating', hint: '9h00-16h00' }, { key: 'semi', label: 'Semi floating', hint: '9h00-19h00' }];
const regimeLabel = v => (SEGMENTS.find(s => s.key === v) || {}).label || '';
const regimeTag = v => v ? '<span class="tag grey" title="Régime de diffusion · ' + (SEGMENTS.find(s => s.key === v) || {}).hint + '">' + regimeLabel(v) + '</span>' : '';
const segSpots = (camp, ym, seg) => num((camp.gridSeg && camp.gridSeg[ym] && camp.gridSeg[ym][seg]) || 0);
const segHasData = (camp, ym) => !!(camp.gridSeg && camp.gridSeg[ym] && SEGMENTS.some(s => camp.gridSeg[ym][s.key] !== undefined && camp.gridSeg[ym][s.key] !== null && camp.gridSeg[ym][s.key] !== ''));
function setGridSeg(id, ym, seg, v) {
  const cp = db.campaigns.find(x => x.id === id); if (!cp || !isMgr()) return;
  cp.gridSeg = cp.gridSeg || {}; cp.gridSeg[ym] = cp.gridSeg[ym] || {};
  let n = null;
  if (v === '' || v === null) delete cp.gridSeg[ym][seg];
  else { n = Math.max(0, Math.round(num(v))); if (!(n >= 0)) return; cp.gridSeg[ym][seg] = n; }
  if (!Object.keys(cp.gridSeg[ym]).length) delete cp.gridSeg[ym];
  cp.grid = cp.grid || {};
  if (segHasData(cp, ym)) cp.grid[ym] = SEGMENTS.reduce((s, x) => s + segSpots(cp, ym, x.key), 0);
  else delete cp.grid[ym];
  const c = contractOf(cp.contractId);
  audit('Grille de diffusion', 'Campagne', id, (c || {}).odp + ' · ' + cp.label + ' · ' + ym + ' · ' + (SEGMENTS.find(s => s.key === seg) || {}).label + ' : ' + (n === null ? 'effacé' : n + ' spot(s)'));
  commit(); if (window.drawGrid) window.drawGrid();
}
/* Répartition du montant HT et des spots, mois par mois, au prorata de ce qui a été (ou est estimé) diffusé */
function allocByMonth(camp, field = 'amountHT') {
  const months = monthsTouched(camp), out = {};
  if (!months.length) return out;
  const spotsByM = {}; months.forEach(ym => { spotsByM[ym] = gridSpots(camp, ym); });
  if (field === 'spots') { months.forEach(ym => { out[ym] = spotsByM[ym]; }); return out; }
  const totalSpots = sum(months, ym => spotsByM[ym]);
  if (totalSpots > 0.0001) {
    months.forEach(ym => { out[ym] = camp.amountHT * spotsByM[ym] / totalSpots; });
  } else {   // pas de notion de spots sur cette campagne : répartition par jours
    const totalDays = sum(months, ym => daysInCampMonth(camp, ym));
    months.forEach(ym => { out[ym] = totalDays ? camp.amountHT * daysInCampMonth(camp, ym) / totalDays : 0; });
  }
  return out;
}
function setGridSpots(id, ym, v) {
  const cp = db.campaigns.find(x => x.id === id); if (!cp || !isMgr()) return;
  cp.grid = cp.grid || {};
  if (v === '' || v === null) delete cp.grid[ym];
  else { const n = Math.max(0, Math.round(num(v))); if (!(n >= 0)) return; cp.grid[ym] = n; }
  const c = contractOf(cp.contractId);
  audit('Grille de diffusion', 'Campagne', id, (c || {}).odp + ' · ' + cp.label + ' · ' + ym + ' : ' + (v === '' ? 'estimation par jours' : cp.grid[ym] + ' spot(s) réels'));

}

      (mgr && hasManual ? '<button type="button" class="button is-small mt-3" onclick="resetGrid(\'' + cp.id + '\')">Réinitialiser toute la grille (estimation par jours)</button>' : '');

/* ==========================================================================
   CALENDRIER D'OCCUPATION : vue mensuelle en un coup d'œil du remplissage
   antenne (nombre de spots diffusés par jour, toutes campagnes visibles).
   ========================================================================== */
function daysOfMonth(ym) {
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), last = new Date(y, m, 0).getDate();
  return Array.from({ length: last }, (_, i) => ym + '-' + p2(i + 1));
}
/* Nombre de spots d'une campagne pour un jour donné : montant mensuel de la grille (ou de l'estimation), réparti à parts égales sur les jours du mois où la campagne est active */
function campSpotsOnDay(x, d) {
  if (!x.start || !x.end || d < x.start || d > x.end) return 0;
  const ym = ymOf(d), monthSpots = (allocByMonth(x, 'spots') || {})[ym] || 0, dim = daysInCampMonth(x, ym);
  return dim ? monthSpots / dim : 0;
}
function monthFillData(ym) {
  const ids = visIds();
  const list = db.campaigns.filter(x => ids.has(x.contractId) && !isLost(contractOf(x.contractId)));
  return daysOfMonth(ym).map(d => {
    const camps = list.filter(x => x.start <= d && x.end >= d);
    return { date: d, spots: sum(camps, x => campSpotsOnDay(x, d)), camps };
  });
}

function saveContract(c, f, close, pricing) {
  const client = (f.client || '').trim(), type = f.type, comm = type === 'communication', amount = round2(num(f.amountHT));
  const status = c ? (c.status || 'signe') : (comm ? 'signe' : (f.status || 'proposition')), signed = status === 'signe';

  if (comm ? amount < 0 : !(amount > 0)) return errBox(comm ? 'Le montant ne peut pas être négatif.' : 'Le montant HT doit être supérieur à 0.');
  if (f.proposalDate && (!okDate(f.proposalDate) || f.proposalDate > today())) return errBox('Date de création de l\'ODP invalide (pas dans le futur).');
  if (signed) {
    if (!okDate(f.signedDate)) return errBox('Date de signature invalide.');
    if (f.signedDate > today()) return errBox('La date de signature ne peut pas être dans le futur.');
    if (!comm && f.proposalDate && f.signedDate < f.proposalDate) return errBox('La signature ne peut pas précéder la création de l\'ODP.');
  }
  if (c && comm !== isComm(c)) return errBox('Le type « communication » ne peut pas être changé après la création.');
  const refDate = signed ? f.signedDate : (f.proposalDate || c && c.proposalDate || today());
  const dup = db.contracts.find(x => (!c || x.id !== c.id) && x.client.toLowerCase() === client.toLowerCase() && x.signedDate === refDate && Math.abs(x.amountHT - amount) < 0.01 && x.type === type);
  if (dup && !confirm('Un contrat identique existe déjà (' + dup.odp + '). Enregistrer quand même ?')) return;
  if (c) {
    const ym0 = ymOf(c.signedDate), ym1 = ymOf(refDate);
    if (isCA(c) && (db.closures[ym0] || db.closures[ym1]) && (ym0 !== ym1 || Math.abs(c.amountHT - amount) > 0.001) &&
      !confirm('Ce contrat appartient à un mois déjà clôturé : le CA de ce mois va changer et sera signalé « modifié depuis la clôture ». Continuer ?')) return;
    if (f.odp !== undefined && f.odp.trim() !== c.odp) {
      const o = f.odp.trim();
      if (!/^(\d{4}-\d{4}|COM-\d{4}-\d{3})$/.test(o)) return errBox('Format ODP attendu : AAAA-#### (ou COM-AAAA-### pour la communication)');
      if (db.contracts.some(x => x.id !== c.id && x.odp === o)) return errBox('Ce n° d\'ODP est déjà utilisé.');
      audit('Modification ODP', 'Contrat', c.id, c.odp + ' → ' + o); c.odp = o;
    }
    Object.assign(c, { client, sellerId: f.sellerId, signedDate: refDate, type, label: f.label.trim(), amountHT: amount, driveUrl: f.driveUrl || '', notes: f.notes || '' });
    if (pricing) c.pricing = pricing; else delete c.pricing;
    if (!comm) c.proposalDate = f.proposalDate || c.proposalDate || '';
    audit('Modification', 'Contrat', c.id, c.odp + ' · ' + client + ' · ' + eur(amount));
    close(); commit(); toast('Contrat modifié');
  } else {
    const odpDate = comm ? f.signedDate : (f.proposalDate || refDate);
    const n = { id: uid(), odp: assignOdp(odpDate, type), client, sellerId: f.sellerId, status, proposalDate: comm ? '' : odpDate, signedDate: refDate, type, label: f.label.trim(), amountHT: amount, driveUrl: f.driveUrl || '', filed: false, tasks: {}, notes: f.notes || '', createdAt: new Date().toISOString(), createdBy: me().name };
    if (pricing) n.pricing = pricing;
    db.contracts.push(n); audit('Création', 'Contrat', n.id, n.odp + ' · ' + client + ' · ' + eur(amount) + (status === 'proposition' ? ' (proposition)' : ''));
    close(); commit(); toast((status === 'proposition' ? 'Proposition créée' : 'Contrat créé') + ' : ' + n.odp); openContract(n.id);
    if (signed && !comm) dropboxDialog(n.id);
  }
}

/* ---------- Campagnes (suivi mensuel + Aquira) ---------- */
function vCampaigns() {
  const ym = ST.cm, ids = visIds(), mgr = isMgr(), t = today();
  const first = ym + '-01', last = ym + '-31';
  const list = db.campaigns.filter(x => ids.has(x.contractId) && !isLost(contractOf(x.contractId)) && x.start <= last && x.end >= first).sort((a, b) => a.start.localeCompare(b.start));

  });
